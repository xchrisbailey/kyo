name: Kyo
options:
  settingPresets: none
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: "0"
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Kyo:
    type: application
    platform: iOS
    sources:
      - Kyo
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kyo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kyo records your voice memos with the microphone.
        INFOPLIST_KEY_NSCameraUsageDescription: Kyo takes photos you attach to your memos.
        # UIBackgroundModes isn't an INFOPLIST_KEY_ setting, so the audio background mode (recording
        # keeps going when Kyo is left or the screen locks) comes from this partial plist, which
        # Xcode merges with the generated Info.plist.
        INFOPLIST_FILE: Config/Kyo-Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: KyoWatch
        embed: true
      - target: KyoWidgets
        embed: true
  KyoWidgets:
    type: app-extension
    platform: iOS
    # The controls run the same intents as the App Shortcuts, so the extension compiles the intents
    # and the router they call. The intents pin themselves to the app process, where the router lives.
    sources:
      - KyoWidgets
      - Kyo/QuickCaptureIntents.swift
      - Shared/QuickCaptureRouter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kyo.widgets
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        # NSExtension isn't an INFOPLIST_KEY_ setting, so it comes from this partial plist.
        INFOPLIST_FILE: Config/KyoWidgets-Info.plist
  KyoWatch:
    type: application
    platform: watchOS
    sources:
      - KyoWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kyo.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kyo records your voice memos with the microphone.
        # WKBackgroundModes isn't an INFOPLIST_KEY_ setting, so the audio background mode (recording
        # keeps going when the wrist is lowered) comes from this partial plist, which Xcode merges
        # with the generated Info.plist.
        INFOPLIST_FILE: Config/KyoWatch-Info.plist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.kyo
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SKIP_INSTALL: YES
  KyoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KyoTests
      - Shared/DailyTask.swift
      - Shared/Habit.swift
      - Shared/HabitSync.swift
      - Shared/TaskSync.swift
      - Shared/ApplicationContextEntries.swift
      - Shared/WatchConnectivityTaskTransport.swift
      - Shared/KyoSchema.swift
      - Shared/TaskRecord.swift
      - Shared/TaskContentPersistence.swift
      - Shared/HabitRecord.swift
      - Shared/HabitContentPersistence.swift
      - Shared/Memo.swift
      - Shared/MemoRecord.swift
      - Shared/MemoAudioRecord.swift
      - Shared/MemoPhotoRecord.swift
      - Shared/MemoPhotoEncoding.swift
      - Shared/MemoStore.swift
      - Shared/MemoSync.swift
      - Shared/WatchMemoList.swift
      - Shared/MemoFileTransfer.swift
      - Shared/WatchRecordingOutbox.swift
      - Shared/MemoHistory.swift
      - Shared/MemoShare.swift
      - Shared/AudioRecording.swift
      - Shared/VoiceTranscriber.swift
      - Shared/LiveTranscribing.swift
      - Shared/OnDeviceLanguageModel.swift
      - Shared/MemoTaskSuggestions.swift
      - Shared/VoiceRecordingSession.swift
      - Shared/QuickCaptureRouter.swift
      - Shared/UserDefaultsImport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kyo.tests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  KyoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KyoUITests
    dependencies:
      - target: Kyo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kyo.uitests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kyo:
    build:
      targets:
        Kyo: all
    run:
      config: Debug
    archive:
      config: Release
  KyoWatch:
    build:
      targets:
        KyoWatch: all
    run:
      config: Debug
    archive:
      config: Release
  KyoTests:
    build:
      targets:
        KyoTests: all
    test:
      config: Debug
      targets:
        - KyoTests
  KyoUITests:
    build:
      targets:
        Kyo: all
        KyoUITests: [test]
    test:
      config: Debug
      targets:
        - KyoUITests
