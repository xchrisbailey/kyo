name: UI Tests

# Only pull requests that change the app target or the UI tests. `Kyo/**` matches the Kyo/
# directory alone, never KyoWatch/, KyoTests/, KyoWidgets/ or KyoUITests/ by prefix.
on:
  pull_request:
    paths:
      - 'Kyo/**'
      - 'KyoUITests/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test KyoUITests
    runs-on: xcode-27
    # The suite takes about 25 minutes on the runner, and a failing run can add 10 minutes of
    # diagnostics collection. The headroom also bounds a hung test runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A cold simulator is the usual cause of launch stalls, so boot it and wait until it is ready.
      # The UDID is resolved from the iOS 27.0 runtime so the boot and the destination name one device.
      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices "iOS 27.0" available | grep -E '^ +iPhone 17 \(' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -n 1)
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 simulator on the iOS 27.0 runtime."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iPhone 17 $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b

      # KYO_WATCH_SYNC_SMOKE is left unset, so WatchSyncSmokeUITests skips itself: there is no
      # paired Watch simulator here.
      # CODE_SIGNING_ALLOWED=NO is left off on purpose: an unsigned build gives KyoWatchWidgets a
      # linker signature with the wrong identifier, and WidgetKit kills it on first launch (#150).
      # App launches sometimes stall on the runner's simulator. A failed test gets one retry, which
      # tells a stall from a real failure: a real failure fails twice.
      # -collect-test-diagnostics never: by default a failed iteration waits up to ten minutes for simulator
      # diagnostics (#152). With it a failed run exits in under a second and still writes the result bundle,
      # screen recordings included, which the next step uploads.
      - name: Test
        run: |
          xcodebuild -project Kyo.xcodeproj -scheme KyoUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -retry-tests-on-failure -test-iterations 2 \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/KyoUITests.xcresult" \
            test

      - name: Upload result bundle
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KyoUITests-xcresult
          path: ${{ runner.temp }}/KyoUITests.xcresult
          if-no-files-found: ignore
          retention-days: 14
