name: Tooling guards
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/lint-ui-tests
      - run: scripts/lint-accessibility-identifiers
      - run: scripts/test-tooling
