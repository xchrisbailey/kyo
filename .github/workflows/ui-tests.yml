name: UI Tests

# Only pull requests that change the app target, the UI tests, or this workflow. `Kyo/**` matches
# the Kyo/ directory alone, never KyoWatch/, KyoTests/, KyoWidgets/ or KyoUITests/ by prefix.
# Draft pull requests skip the suite: coders run `scripts/test` locally, and marking the PR ready
# (`ready_for_review`) starts the run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Kyo/**'
      - 'KyoUITests/**'
      - '.github/workflows/ui-tests.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test KyoUITests (${{ matrix.shard }}/2)
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    # One shard takes about 10 to 14 minutes on the runner: about a minute of build, three to four
    # minutes from the start of the Test step to the first test (xcodebuild boots the simulator and
    # launches the runner), and 5 to 9 minutes of tests. The headroom bounds a hung test runner and
    # covers a retried failure.
    timeout-minutes: 60
    # Each shard builds and runs its own subset of classes on its own runner and simulator. The
    # simulators are not parallel within a runner: CPU contention caused the #152 flake. Shard 1
    # names its classes, balanced by measured time (about 6.5 minutes of tests each after #167).
    # Shard 2 names none: it skips shard 1's classes, so a new UI test class runs there instead of
    # being silently left out. Keep shard 2's -skip-testing list equal to shard 1's classes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            selection: >-
              -only-testing:KyoUITests/SectionCollapseUITests
              -only-testing:KyoUITests/HabitManagerUITests
              -only-testing:KyoUITests/ScheduleUITests
              -only-testing:KyoUITests/ScheduleEventDetailUITests
          - shard: 2
            selection: >-
              -skip-testing:KyoUITests/SectionCollapseUITests
              -skip-testing:KyoUITests/HabitManagerUITests
              -skip-testing:KyoUITests/ScheduleUITests
              -skip-testing:KyoUITests/ScheduleEventDetailUITests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The UDID is resolved from the iOS 27.0 runtime so the build and the test name one device.
      # The simulator is left shut down until xcodebuild boots it for the test: see the Build step.
      - name: Resolve simulator
        run: |
          udid=$(xcrun simctl list devices "iOS 27.0" available | grep -E '^ +iPhone 17 \(' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -n 1)
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 simulator on the iOS 27.0 runtime."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iPhone 17 $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # Nothing here runs against a booted simulator, on purpose (#166). A freshly booted simulator
      # keeps the runner's three cores at a load average of several hundred for the rest of the job,
      # and xcodebuild needed two to four minutes just to print its invocation while it was up,
      # then built in two to two and a half minutes instead of one. With the simulator still shut
      # down, the same xcodebuild prints its invocation in two seconds and the build takes a minute.
      # CODE_SIGNING_ALLOWED=NO is left off on purpose: an unsigned build gives KyoWatchWidgets a
      # linker signature with the wrong identifier, and WidgetKit kills it on first launch (#150).
      - name: Build for testing
        run: |
          xcodebuild -project Kyo.xcodeproj -scheme KyoUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            build-for-testing

      # The Test step starts xcodebuild on the still idle runner, and xcodebuild boots the simulator
      # and waits for it. A step that boots and waits first (this workflow's old Boot simulator step)
      # puts the slow xcodebuild start-up described above back in front of the tests.
      # KYO_WATCH_SYNC_SMOKE is left unset, so WatchSyncSmokeUITests skips itself: there is no
      # paired Watch simulator here.
      # App launches sometimes stall on the runner's simulator. A failed test gets one retry, which
      # tells a stall from a real failure: a real failure fails twice.
      # -collect-test-diagnostics never: by default a failed iteration waits up to ten minutes for
      # simulator diagnostics (#152). With it a failed run exits in under a second and still writes
      # the result bundle, screen recordings included, which the next step uploads.
      # $SELECTION is deliberately unquoted: it holds several -only-testing or -skip-testing flags.
      - name: Test
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          xcodebuild -project Kyo.xcodeproj -scheme KyoUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            $SELECTION \
            -retry-tests-on-failure -test-iterations 2 \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/KyoUITests.xcresult" \
            test-without-building

      - name: Upload result bundle
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KyoUITests-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/KyoUITests.xcresult
          if-no-files-found: ignore
          retention-days: 14
