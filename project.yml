name: Kyo
options:
  settingPresets: none
  bundleIdPrefix: computer.srcery
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    DEVELOPMENT_TEAM: 5U2B7W5F39
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: "0"
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Kyo:
    type: application
    platform: iOS
    sources:
      - Kyo
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kyo records your voice memos with the microphone.
        INFOPLIST_KEY_NSCameraUsageDescription: Kyo takes photos you attach to your memos.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Kyo shows today's events from your calendars on Today. It never changes them.
        # UIBackgroundModes isn't an INFOPLIST_KEY_ setting, so the audio background mode (recording
        # keeps going when Kyo is left or the screen locks) comes from this partial plist, which
        # Xcode merges with the generated Info.plist.
        INFOPLIST_FILE: Config/Kyo-Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: KyoWatch
        embed: true
      - target: KyoWidgets
        embed: true
  KyoWidgets:
    type: app-extension
    platform: iOS
    # The controls run the same intents as the App Shortcuts, so the extension compiles the intents
    # and the router they call. The intents pin themselves to the app process, where the router lives.
    sources:
      - KyoWidgets
      - Kyo/QuickCaptureIntents.swift
      - Shared/QuickCaptureRouter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.widgets
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        # NSExtension isn't an INFOPLIST_KEY_ setting, so it comes from this partial plist.
        INFOPLIST_FILE: Config/KyoWidgets-Info.plist
  KyoWatchWidgets:
    type: app-extension
    platform: watchOS
    # The control runs the same intent as the Watch app, so the extension compiles the intent and
    # the router it calls. The intent pins itself to the Watch app process, where the router lives.
    sources:
      - KyoWatchWidgets
      - KyoWatch/WatchQuickCaptureIntents.swift
      - Shared/QuickCaptureRouter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.watchkitapp.widgets
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        # NSExtension isn't an INFOPLIST_KEY_ setting, so it comes from this partial plist.
        INFOPLIST_FILE: Config/KyoWatchWidgets-Info.plist
  KyoWatch:
    type: application
    platform: watchOS
    sources:
      - KyoWatch
      - Shared
    dependencies:
      - target: KyoWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kyo
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kyo records your voice memos with the microphone.
        # UIBackgroundModes isn't an INFOPLIST_KEY_ setting, so the audio background mode (recording
        # keeps going when the wrist is lowered) comes from this partial plist, which Xcode merges
        # with the generated Info.plist.
        INFOPLIST_FILE: Config/KyoWatch-Info.plist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: computer.srcery.kyo
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SKIP_INSTALL: YES
  KyoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KyoTests
      # Shared is a folder so a new file there is picked up without an edit here. Every file that
      # does not compile into the test bundle is excluded by name.
      - path: Shared
        excludes:
          # A placeholder SwiftUI view with no logic to test.
          - ContentView.swift
      - Kyo/CalendarService.swift
      - Kyo/EventDetails.swift
      - Kyo/ScheduleStore.swift
      - Kyo/FakeCalendarService.swift
      - Kyo/MonthModel.swift
      - Kyo/HabitMonthContent.swift
      - Kyo/TaskMonthContent.swift
      - Kyo/MemoMonthContent.swift
      - Kyo/EventMonthContent.swift
      - Kyo/Theme.swift
      - Kyo/ThemeStore.swift
      - Kyo/PalettePreferenceStore.swift
      - Kyo/ThemeEnvironment.swift
      - Kyo/ThemeNeko.swift
      - Kyo/ThemeTecho.swift
      - Kyo/ThemeSelection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.tests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  KyoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KyoUITests
    dependencies:
      - target: Kyo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.uitests
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  KyoWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - KyoWatchUITests
    dependencies:
      - target: KyoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.kyo.watchuitests
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kyo:
    build:
      targets:
        Kyo: all
    run:
      config: Debug
    archive:
      config: Release
  # KyoWatch has no entry here on purpose. Xcode re-saves a shared scheme whose runnable is a watch
  # app in its own format, which XcodeGen can't reproduce, so a generated KyoWatch.xcscheme never
  # stays clean. Xcode and xcodebuild auto-create the KyoWatch scheme instead.
  KyoTests:
    build:
      targets:
        KyoTests: all
    test:
      config: Debug
      targets:
        - KyoTests
  KyoUITests:
    build:
      targets:
        Kyo: all
        KyoUITests: [test]
    test:
      config: Debug
      targets:
        - KyoUITests
  # This scheme builds only the test bundle, which pulls the Watch app in as a dependency. It must
  # not list KyoWatch itself: that would stop Xcode auto-creating the KyoWatch scheme above. It's
  # shared so `scripts/test KyoWatchUITests` works from the command line. Whether Xcode
  # re-saves it the way it does a watch-app scheme is untested.
  KyoWatchUITests:
    build:
      targets:
        KyoWatchUITests: [test]
    test:
      config: Debug
      targets:
        - KyoWatchUITests
